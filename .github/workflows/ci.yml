name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test
    services:
      postgres:
        image: postgis/postgis:13-3.5
        command: >-
          postgres
          -c shared_buffers=250MB
          -c effective_cache_size=700MB
          -c work_mem=5MB
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: world
        ports:
          - 5432:5432
        options: >-
          --memory 1000m
          --health-cmd "pg_isready --username postgres --dbname world"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8-debian
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: world
        ports:
          - 3306:3306
        options: >-
          --memory 1000m
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        scala: [ 2.13.x, 3.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize Databases
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: world
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_PWD: password
        run: |
          psql --set ON_ERROR_STOP=on --file init/postgres/config.sql
          psql --set ON_ERROR_STOP=on --command "SELECT pg_reload_conf()"
          psql --set ON_ERROR_STOP=on --file init/postgres/test-db.sql
          mysql --host=127.0.0.1 --port="$MYSQL_PORT" --user=root world < init/mysql/test-table.sql

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 17
          java-package: jdk

      - name: Install SBT
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Cache SBT
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
        with:
          extraKey: v2

      - name: Lint
        run: sbt ++${{ matrix.scala }} scalafmtCheckAll

      - name: Compile
        run: sbt ++${{ matrix.scala }} Test/compile

      - name: Test
        run: sbt ++${{ matrix.scala }} modules/test
